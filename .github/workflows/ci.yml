name: Verificación Milfiguras
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run verify:release
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag milfiguras:test .
      - name: Comprobar arranque y volumen de datos
        run: |
          docker run --detach --name milfiguras-ci --publish 127.0.0.1:3001:3000 --env PUBLIC_ORIGIN=http://localhost:3001 --env ADMIN_EMAIL=admin@example.test --env ADMIN_PASSWORD=TestDocker2026! --volume milfiguras-ci-data:/app/data milfiguras:test
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3001/healthz
      - if: always()
        run: |
          docker logs milfiguras-ci || true
          docker rm --force milfiguras-ci || true
